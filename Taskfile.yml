# Taskfile — automatización del ciclo de desarrollo de la consola.
#
# Herramientas requeridas (instalación recomendada):
#   go install mvdan.cc/gofumpt@latest                              # formateador
#   curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin   # linter
#   go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest   # documentación Markdown
#
# Uso:
#   task run        # ejecutar el servidor web
#   task test       # formatear el código y ejecutar las pruebas
#   task build      # compilar el binario final (./vmcons)
#   task doc        # regenerar docs/api/ desde los comentarios del código
#   task openapi    # validar el contrato docs/openapi.yaml
#   task check      # fmt + lint + test + doc-check (antes de cada commit)
#
# Cliente web (web/): requiere pnpm.
#   task web-install  # instalar las dependencias del cliente
#   task web-dev      # servidor de desarrollo con proxy a la API
#   task web-test     # pruebas del cliente con Vitest
#   task web-build    # compilar el cliente en web/dist

version: "3"

vars:
  BIN: vmcons
  PKGS: ./...

tasks:
  run:
    desc: Ejecutar el servidor web de la consola
    cmd: go run .

  test:
    desc: Formatear el código y ejecutar las pruebas unitarias
    cmds:
      - task: fmt
      - go test {{.PKGS}} -race -cover -count=1

  fmt:
    desc: Formatear el código Go con gofumpt (estricto)
    cmd: gofumpt -l -w .

  lint:
    desc: Verificar la calidad del código con golangci-lint
    cmd: golangci-lint run {{.PKGS}}

  doc:
    desc: Generar la documentación Markdown desde los comentarios del código
    cmds:
      - rm -rf docs/api
      - gomarkdoc -o "docs/api/{{`{{.Dir}}`}}.md" ./internal/...
      - gomarkdoc -o docs/api/main.md .

  doc-check:
    desc: Verificar que la documentación generada en docs/api/ esté actualizada
    cmds:
      - gomarkdoc --check -o "docs/api/{{`{{.Dir}}`}}.md" ./internal/...
      - gomarkdoc --check -o docs/api/main.md .

  openapi:
    desc: Validar el contrato OpenAPI con Redocly (requiere red)
    cmd: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  check:
    desc: Ciclo completo de calidad (fmt + lint + test + doc-check)
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: doc-check
      - task: web-test

  build:
    desc: Compilar el binario final (vmcons) con la interfaz embebida
    deps: [web-build]
    cmd: go build -o {{.BIN}} .

  # ---------------------------------------------------------------
  # Cliente web (web/)
  # ---------------------------------------------------------------
  web-install:
    desc: Instalar las dependencias del cliente web
    dir: web
    cmd: pnpm install --frozen-lockfile

  web-dev:
    desc: Servidor de desarrollo del cliente web con proxy a la API
    dir: web
    cmd: pnpm dev

  web-test:
    desc: Ejecutar las pruebas del cliente web con Vitest
    dir: web
    cmd: pnpm test

  web-build:
    desc: Compilar el cliente web en web/dist
    dir: web
    cmd: pnpm build

  tidy:
    desc: Ordenar dependencias y formato de go.mod
    cmds:
      - go mod tidy
      - gofmt -s -w .

  diagramas:
    desc: Renderizar los diagramas PlantUML y copiarlos al informe
    cmds:
      - plantuml -tpng docs/diagramas/*.puml
      - cp docs/diagramas/*.png docs/informe/images/
