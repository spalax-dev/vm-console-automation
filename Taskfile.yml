# Taskfile — automatización del ciclo de desarrollo de la consola.
#
# Instalación de dependencias de desarrollo:
#   task setup      # descarga las herramientas de go.mod y las de web/
#   task doctor     # comprobar herramientas y dependencias del sistema
#
# Uso:
#   task run        # ejecutar la consola sin variables de entorno (reinicia)
#   task stop       # detener la consola
#   task test       # formatear el código y ejecutar las pruebas
#   task build      # compilar el binario final (./vmcons)
#   task install    # instalar en ~/.local/bin y ~/.local/share/vmcons
#   task uninstall  # desinstalar de ~/.local
#   task doc        # regenerar docs/api/ desde los comentarios del código
#   task openapi    # validar el contrato docs/openapi.yaml
#   task check      # fmt + lint + test + doc-check (antes de cada commit)
#
# El cliente web (web/) se maneja con pnpm dentro de su carpeta:
#   cd web && pnpm dev | pnpm test | pnpm build

version: "3"

vars:
  BIN: vmcons
  PKGS: ./...
  RACE: '{{if eq OS "windows"}}{{else}}-race{{end}}'

tasks:
  setup:
    desc: Instalar las dependencias de desarrollo de Go y del frontend
    cmds:
      - task: setup-go
      - task: setup-web

  setup-go:
    desc: Descargar las herramientas y dependencias fijadas en go.mod
    cmd: go mod download

  setup-web:
    desc: Instalar las dependencias del frontend con pnpm
    dir: web
    cmd: pnpm install --frozen-lockfile

  doctor:
    desc: Comprobar las dependencias de desarrollo y del sistema
    cmd: ./scripts/dev-doctor.sh

  run:
    desc: Ejecutar la consola sin configuración previa (reinicia una instancia anterior)
    cmds:
      - pkill -f '(consola-vm|/vmcons)$' >/dev/null 2>&1 || true
      - if command -v pnpm >/dev/null 2>&1; then (cd web && pnpm build); fi
      - go run .

  stop:
    desc: Detener la consola iniciada con task run
    cmd: pkill -f '(consola-vm|/vmcons)$' >/dev/null 2>&1 || true

  test:
    desc: Formatear el código y ejecutar las pruebas unitarias
    cmds:
      - task: fmt
      - go test {{.PKGS}} {{.RACE}} -cover -count=1

  fmt:
    desc: Formatear el código Go con gofumpt (estricto)
    cmd: go tool gofumpt -l -w .

  lint:
    desc: Verificar la calidad del código con golangci-lint
    cmd: go tool golangci-lint run {{.PKGS}}

  doc:
    desc: Generar la documentación Markdown desde los comentarios del código
    cmds:
      - rm -rf docs/api
      - go tool gomarkdoc -o "docs/api/{{`{{.Dir}}`}}.md" ./internal/...
      - go tool gomarkdoc -o docs/api/main.md .

  doc-check:
    desc: Verificar que la documentación generada en docs/api/ esté actualizada
    cmds:
      - go tool gomarkdoc --check -o "docs/api/{{`{{.Dir}}`}}.md" ./internal/...
      - go tool gomarkdoc --check -o docs/api/main.md .

  openapi:
    desc: Validar el contrato OpenAPI con Redocly (requiere red)
    cmd: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  check:
    desc: Ciclo completo de calidad (fmt + lint + test + doc-check)
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: doc-check

  build:
    desc: Compilar el binario final (vmcons) con la interfaz embebida
    cmd: go build -o {{.BIN}} .

  install:
    desc: Instalar el binario en ~/.local/bin y la interfaz en ~/.local/share/vmcons
    cmds:
      - cd web && pnpm build
      - mkdir -p "$HOME/.local/bin" "$HOME/.local/share/vmcons"
      - go build -o "$HOME/.local/bin/vmcons" .
      - rm -rf "$HOME/.local/share/vmcons/web"
      - cp -R web/dist "$HOME/.local/share/vmcons/web"
      - echo "vmcons instalado:"
      - echo "  binario   $HOME/.local/bin/vmcons"
      - echo "  interfaz  $HOME/.local/share/vmcons/web"
      - echo "Añade esta línea a tu perfil (~/.zshrc o ~/.bashrc):"
      - echo "  export VMCONS_WEB=\"\$HOME/.local/share/vmcons/web\""

  uninstall:
    desc: Eliminar la instalación de ~/.local
    cmds:
      - rm -f "$HOME/.local/bin/vmcons"
      - rm -rf "$HOME/.local/share/vmcons"
      - echo "vmcons desinstalado de ~/.local"

  tidy:
    desc: Ordenar dependencias y formato de go.mod
    cmds:
      - go mod tidy
      - gofmt -s -w .

  diagramas:
    desc: Renderizar los diagramas PlantUML y copiarlos al informe
    cmds:
      - plantuml -tpng docs/diagramas/*.puml
      - cp docs/diagramas/*.png docs/informe/images/
