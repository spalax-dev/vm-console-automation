# Configuración de gomarkdoc: documentación Markdown generada a partir
# de los comentarios de documentación del código Go.
#
# La salida se genera con `task doc` en docs/api/ y se verifica con
# `task doc-check`. No se edita a mano.

format: github
include-unexported: true
repository:
  url: https://github.com/spalax-dev/vm-console-automation
  default-branch: main
